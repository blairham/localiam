# Pre-commit configuration for localiam.
# Install: pre-commit install
# Run:     pre-commit run --all-files
# Update:  pre-commit autoupdate

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--allow-multiple-documents']
        # Helm templates are Go templates until rendered; `helm lint` and the
        # render in CI's charts job validate them.
        exclude: ^charts/[^/]+/templates/
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  # golangci-lint at commit time, via the upstream hooks (no local scripts).
  # `golangci-lint-fmt` runs the formatters configured in .golangci.yml
  # (gofumpt, gci, golines); `golangci-lint` lints only what changed since HEAD.
  # Keep this rev in lockstep with the golangci-lint version in go.mod's `tool`
  # block (see .golangci.yml).
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.14.0
    hooks:
      - id: golangci-lint-fmt
      - id: golangci-lint

  # Secret scanning. Allowlist for the AWS published example creds lives in
  # .gitleaks.toml — read the warning there before widening it.
  # Go housekeeping.
  - repo: https://github.com/TekWizely/pre-commit-golang
    rev: v1.0.0-rc.4
    hooks:
      - id: go-mod-tidy-repo

  # One golang pin per repo, at the root, that every go.mod must match: CI reads
  # go-version-file: go.mod, so without this the two could build different Go
  # with nothing noticing. check-conflict-markers replaces upstream's
  # check-merge-conflict, which misses a committed diff3 base marker.
  - repo: https://github.com/blairham/pre-commit-hooks
    rev: v0.4.0
    hooks:
      # Every .go file carries the two-line SPDX header; a file without one
      # has no stated license once it is copied out of the repo.
      - id: check-license-headers
        args: [--license, Apache-2.0]
      - id: check-go-version-sync
      - id: check-conflict-markers
      # Known-vulnerable dependencies fail the commit, not the release.
      - id: go-vulncheck

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # YAML style (sequence indentation etc.; config in .yamllint.yml)
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ['-c', '.yamllint.yml']
        exclude: ^charts/[^/]+/templates/

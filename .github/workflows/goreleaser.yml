name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Must already exist."
        required: true
        type: string

# Read-only by default; the release job below asks for exactly what it writes.
permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release and its assets
      # The image goes to ghcr.io in the same run — see dockers_v2 in
      # .goreleaser.yaml. GITHUB_TOKEN writes it; nothing extra to store.
      packages: write
      # Keyless cosign: the OIDC token is the signing identity — see signs and
      # docker_signs in .goreleaser.yaml.
      id-token: write
      # SLSA build provenance for the archives — see "Attest build provenance".
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
          cache: false # replaced by the release-scoped cache below

      # Release-scoped Go cache: setup-go's built-in cache is exact-match on
      # go.sum and usually saved by CI test jobs (host-platform builds only);
      # this one falls back on a restore-keys prefix and is saved at job end —
      # after goreleaser — so it warms every cross-compiled GOOS/GOARCH target.
      - name: Restore release Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-release-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-release-${{ runner.os }}-

      - name: Checkout tag (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: git checkout "refs/tags/${{ inputs.tag }}"

      - name: Run tests
        run: make test

      # The runner's default `docker` driver cannot export a manifest list;
      # without this the release fails at its LAST step, after the tag and the
      # GitHub release are already public.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # SLSA build provenance for every archive, signed through the same OIDC
      # identity as the cosign signatures and recorded in GitHub's attestation
      # store, so `gh attestation verify <archive> --repo blairham/localiam`
      # works. checksums.txt names every archive by digest, so one statement
      # covers them all.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # The same bundle as a release asset. OpenSSF Scorecard's Signed-Releases
      # check finds provenance by an .intoto.jsonl asset on the release; it does
      # not read the attestation store. jq -c makes the bundle one JSON line.
      - name: Upload provenance to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          jq -c . "$BUNDLE" > localiam.intoto.jsonl
          gh release upload "$TAG" localiam.intoto.jsonl --clobber

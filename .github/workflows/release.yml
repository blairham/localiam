name: Release

# A v* tag publishes: blairham/.github's go-release.yml runs GoReleaser, which
# pushes the archives and ghcr.io/blairham/localiam:<version> (amd64 and
# arm64; see dockers_v2 in .goreleaser.yaml), then signs checksums.txt
# keylessly and attests build provenance for the archives and for the image's
# multi-arch index digest. The release notes are the tag's section of
# CHANGELOG.md. The signing identity is go-release.yml itself; SECURITY.md
# shows how to verify it.
#
# The charts are not published by a release (they stay at version 0.0.0 and
# are installed from the repository), so no `charts` appVersion check.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0). Must already exist. Leave empty for a dry run."
        required: false
        type: string
      dry-run:
        description: "Build with GoReleaser --snapshot; publish, sign and attest nothing."
        required: false
        type: boolean
        default: false

# Read-only by default; the release job asks for exactly what it writes.
permissions:
  contents: read

jobs:
  release:
    name: Release
    permissions:
      contents: write # the GitHub release and its assets
      packages: write # the image on ghcr.io; GITHUB_TOKEN writes it
      # Keyless cosign and the provenance attestations both sign with the
      # workflow's OIDC identity.
      id-token: write
      attestations: write # store the provenance in the repository's attestations
    uses: blairham/.github/.github/workflows/go-release.yml@48d6c8f94aa8381c550818e0a0b2a0d61f280a6b # v0.0.2
    with:
      tag: ${{ inputs.tag }}
      snapshot: ${{ inputs.dry-run == true }}
      images: '["ghcr.io/blairham/localiam"]'
    secrets:
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

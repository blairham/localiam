name: CI

# Everything that gates a merge. The jobs themselves — Pre-commit, Detect
# changed files, Build and test, Fuzz — are blairham/.github's go-ci.yml,
# shared with every Go repository there; their checks report as
# `CI / <job>`. The image build is its go-image.yml (`Image / Build image`).
# Repository-specific jobs go below, `needs: ci`, with their steps gated on
# `needs.ci.outputs.code == 'true'` (never a job-level `if:` or a `paths:`
# filter: a required check that never runs is pending forever).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # A squash merge lands a tree no pull request ever built — the branch was
    # tested before the squash, and `main` may have moved under it since — so
    # the merge result gets its own run rather than inheriting the branch's
    # green tick.
    branches: [main]
  schedule:
    # Weekly, for go-ci.yml's Fuzz job, which explores on main and on this
    # schedule but never on a pull request.
    - cron: '53 5 * * 3'

permissions:
  contents: read

concurrency:
  # A superseded push is not worth finishing; only the newest commit matters.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # go-ci.yml's default test command is `go test -race ./...`. -race matters
  # here more than in most repos: the credential store is written by the
  # issuer while proxies read it, and the whole point of the component is
  # that it answers correctly under concurrent connections.
  ci:
    name: CI
    uses: blairham/.github/.github/workflows/go-ci.yml@99060d62d0693570a360127ab698307d276630da # v0.0.0

  # localiam is consumed as a CONTAINER (agent sidecar, proxy sidecar, server),
  # so a Dockerfile that stopped building would break every cluster while the
  # Go tests stayed green. Build only; a v* tag publishes (release.yml).
  image:
    name: Image
    needs: ci
    uses: blairham/.github/.github/workflows/go-image.yml@99060d62d0693570a360127ab698307d276630da # v0.0.0
    with:
      run: ${{ needs.ci.outputs.code == 'true' }}

  # The charts are part of the product: a template error ships as a failed
  # install on someone else's cluster. Lint both, and render the server chart
  # with every option on, so a branch that only runs under non-default values
  # is exercised too.
  charts:
    name: Helm charts
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.ci.outputs.code == 'true'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: needs.ci.outputs.code == 'true'
      - name: Lint
        if: needs.ci.outputs.code == 'true'
        run: helm lint charts/localiam charts/localiam-sidecar
      - name: Render with every option on
        if: needs.ci.outputs.code == 'true'
        run: |
          helm template ci charts/localiam \
            --set registration.token=ci \
            --set specs.api.podIdentity.permissions.elastiCache=true \
            --set 'bootstrapPrincipals[0].accessKeyId=AKIDCI00000000000000' \
            --set 'bootstrapPrincipals[0].secretKey=ci' \
            --set 'bootstrapPrincipals[0].arn=arn:aws:iam::000000000000:role/ci' \
            --set shell.enabled=true --set shell.token=ci \
            --set networkPolicy.enabled=true > /dev/null

# gitleaks configuration for localiam: the default rules.
#
# Rendered from blairham/.github baseline/gitleaks.toml.tmpl by `make sync`.
# An allowlist entry is an override (overrides/localiam.yml) and carries the
# reason it is not a secret. Allowlist exact values, never a broad pattern: a
# wildcard silences the rule that exists to catch a genuine key.

[extend]
useDefault = true

[allowlist]
description = "AWS published SigV4 example credentials used as golden test vectors"
regexes = [
  '''AKIDEXAMPLE''',
  '''wJalrXUtnFEMI/K7MDENG\+bPxRfiCYEXAMPLEKEY''',
]
